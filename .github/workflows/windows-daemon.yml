name: Windows daemon regression

on:
  push:
    branches: [fix/windows-korean-daemon]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-daemon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup VC++ environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64
          spectre: true

      - name: Install dependencies
        id: deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: 6.11.3
          vcpkg-triplet: x64-windows-release

      - name: Configure
        shell: pwsh
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON -DSKIP_BUILD_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DPACKAGE_VERSION_LABEL=1.27.0-korean-daemon-${{ github.run_number }}
          ${{ steps.deps.outputs.vcpkg-cmake-config }}

      - name: Build
        run: cmake --build build --config Release -j8

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/src/unittests --output-on-failure --output-junit "${{ github.workspace }}/windows-test-results.xml"

      - name: Package MSI and portable ZIP
        run: cmake --build build --config Release --target package

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: deskflow-1.27.0-korean-daemon-windows-x64
          path: build/deskflow-*.msi
          if-no-files-found: error

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-daemon-test-results
          path: |
            windows-test-results.xml
            build/src/unittests/Testing/Temporary/LastTest.log
